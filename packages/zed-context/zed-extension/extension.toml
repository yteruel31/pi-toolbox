id = "pi-selection-bridge"
name = "Pi Selection Bridge"
version = "0.2.0"
schema_version = 1
authors = ["Yoann TERUEL <yoann.teruel@gmail.com>"]
description = "Streams the current editor selection to a Pi terminal session through a private local language server."
repository = "https://github.com/yteruel31/pi-toolbox"

[language_servers.pi-selection-bridge]
name = "Pi Selection Bridge"
languages = [
